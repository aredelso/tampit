name: tampit

services:
  db:
    image: postgres:15
    container_name: tampit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tampit_dev
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tampit-server
    working_dir: /usr/src/app
    entrypoint: ['/usr/src/app/docker-entrypoint.sh']
    command: ['npm', 'run', 'dev']
    restart: unless-stopped
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@db:5432/tampit_dev'
      PORT: '4000'
      NODE_ENV: development
      JWT_SECRET: 'dev-secret-change-in-prod'
      CHOKIDAR_USEPOLLING: 'true'
    depends_on:
      - db
    ports:
      - '4000:4000'
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    develop:
      watch:
        - action: rebuild
          path: ./server/package.json

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: tampit-client
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_URL: 'http://localhost:4000'
    depends_on:
      - server
    ports:
      - '3000:3000'
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    develop:
      watch:
        - action: rebuild
          path: ./client/package.json

volumes:
  db_data:
